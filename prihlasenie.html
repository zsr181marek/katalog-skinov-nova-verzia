<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 80vh; padding-top: 90px; padding-bottom: 30px;">

  <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">

    <h3 class="text-center mb-4">Prihlásenie</h3>

    <form id="loginForm">

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" id="email" class="form-control"
                 placeholder="zadajte email" autocomplete="email" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Heslo</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="password" class="form-control"
                 placeholder="zadajte heslo"
                 autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" id="loginButton"
              class="btn btn-primary w-100">
        Prihlásiť sa
      </button>

      <div id="message" class="mt-3" role="status"
           aria-live="polite"></div>

      <div class="text-center mt-3">
        <a href="zabudnute-heslo.html">Zabudnuté heslo</a><br>
        <a href="registracia.html">Vytvoriť nový účet</a>
      </div>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // DOPLŇ ÚDAJE ZO SVOJHO PROJEKTU SUPABASE
  const SUPABASE_URL = "https://dhqnvsseamfbzbdwerut.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_i0ewGk_1lebSVchuqkJbog_XbchvjxD";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");
  const button = document.getElementById("loginButton");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    message.textContent = "";
    message.className = "mt-3";

    button.disabled = true;
    button.textContent = "Prihlasujem...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        console.error("Chyba Supabase:", error);
        message.textContent = "Chyba: " + error.message;
        message.classList.add("text-danger");
        return;
      }

      message.textContent = "Prihlásenie bolo úspešné.";
      message.classList.add("text-success");

      // Po úspešnom prihlásení otvor úvodnú stránku.
      window.location.href = "index.html";

    } catch (error) {
      console.error("Chyba pripojenia:", error);
      message.textContent = "Chyba: " + error.message;
      message.classList.add("text-danger");

    } finally {
      button.disabled = false;
      button.textContent = "Prihlásiť sa";
    }
  });
</script>
