<main class="container">
  <div class="auth-container">
    <h1>Zabudnuté heslo</h1>

    <p class="text-muted">
      Zadaj e-mail, ktorý si použil pri registrácii.
      Pošleme ti odkaz na obnovenie hesla.
    </p>

    <form id="resetForm">
      <label for="email" class="form-label">E-mail</label>

      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="Zadaj svoj e-mail"
        autocomplete="email"
        required
      >

      <button type="submit" id="resetButton" class="btn btn-primary">
        Odoslať odkaz
      </button>

      <p id="message" class="mt-3 mb-0" role="status"></p>
    </form>

    <p class="text-center mt-4 mb-0">
      <a href="prihlasenie.html">Späť na prihlásenie</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://dhqnvsseamfbzbdwerut.supabase.co";
  const SUPABASE_KEY = "sb_publishable_i0ewGk_1lebSVchuqkJbog_XbchvjxD";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const button = document.getElementById("resetButton");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    button.disabled = true;
    button.textContent = "Odosielam...";
    message.textContent = "";
    message.className = "mt-3 mb-0";

    try {
      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo:
            window.location.origin + "/obnovenie-hesla.html"
        });

      if (error) throw error;

      message.className = "mt-3 mb-0 text-success";
      message.textContent =
        "Ak je e-mail zaregistrovaný, dostaneš pokyny na obnovenie hesla. Skontroluj aj priečinok Spam.";

    } catch (error) {
      message.className = "mt-3 mb-0 text-danger";
      message.textContent =
        "E-mail sa nepodarilo odoslať. Skontroluj nastavenia Supabase a skús to znova.";
    } finally {
      button.disabled = false;
      button.textContent = "Odoslať odkaz";
    }
  });
</script>
