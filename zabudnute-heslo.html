<main class="container">
  <div class="auth-container">

    <h1>Zabudnuté heslo</h1>

    <p class="text-muted">
      Zadaj e-mail, ktorý si použil pri registrácii.
      Pošleme ti odkaz na obnovenie hesla.
    </p>

    <form id="resetForm">

      <label for="email" class="form-label">E-mail</label>

      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="Zadaj svoj e-mail"
        autocomplete="email"
        required
      >

      <!-- Cloudflare Turnstile CAPTCHA -->
      <div class="d-flex justify-content-center my-3">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAF595nZNCcL4_iSk">
        </div>
      </div>

      <button type="submit" id="resetButton" class="btn btn-primary">
        Odoslať odkaz
      </button>

      <p id="message" class="mt-3 mb-0" role="status"></p>

    </form>

    <p class="text-center mt-4 mb-0">
      <a href="prihlasenie.html">Späť na prihlásenie</a>
    </p>

  </div>
</main>

<script>
  const SUPABASE_URL = "https://dhqnvsseamfbzbdwerut.supabase.co";
  const SUPABASE_KEY = "sb_publishable_i0ewGk_1lebSVchuqkJbog_XbchvjxD";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const button = document.getElementById("resetButton");

  const REDIRECT_URL =
    "https://zsr181marek.github.io/katalog-skinov-nova-verzia/obnovenie-hesla.html";

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    // Získanie CAPTCHA tokenu
    const captchaToken = window.turnstile
      ? window.turnstile.getResponse()
      : "";

    if (!captchaToken) {
      message.className = "mt-3 mb-0 text-danger";
      message.textContent = "Najprv potvrď CAPTCHA.";
      return;
    }

    button.disabled = true;
    button.textContent = "Odosielam...";
    message.textContent = "";
    message.className = "mt-3 mb-0";

    try {
      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: REDIRECT_URL,
          captchaToken: captchaToken
        });

      if (error) {
        throw error;
      }

      message.className = "mt-3 mb-0 text-success";
      message.textContent =
        "Ak je e-mail zaregistrovaný, dostaneš pokyny na obnovenie hesla. Skontroluj aj priečinok Spam.";

      form.reset();

    } catch (error) {
      console.error("Chyba pri obnove hesla:", error);

      message.className = "mt-3 mb-0 text-danger";
      message.textContent =
        "E-mail sa nepodarilo odoslať. Skús to znova alebo kontaktuj správcu stránky.";

    } finally {
      if (window.turnstile) {
        window.turnstile.reset();
      }

      button.disabled = false;
      button.textContent = "Odoslať odkaz";
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
