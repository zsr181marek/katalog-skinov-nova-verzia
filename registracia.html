<main class="container">
  <div class="auth-container">
    <h1>Vytvorenie účtu</h1>

    <form id="registerForm">
      <label for="email" class="form-label">E-mail</label>
      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="Zadaj svoj e-mail"
        autocomplete="email"
        required
      >

      <label for="password" class="form-label">Heslo</label>
      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="Aspoň 8 znakov"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword" class="form-label">
        Zopakuj heslo
      </label>
      <input
        type="password"
        id="confirmPassword"
        class="form-control"
        placeholder="Zadaj heslo znova"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="registerButton" class="btn btn-primary">
        Registrovať sa
      </button>

      <p id="message" class="mt-3 mb-0" role="status"></p>
    </form>

    <p class="text-center mt-4 mb-0">
      Už máš účet?
      <a href="prihlasenie.html">Prihlás sa</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://dhqnvsseamfbzbdwerut.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_i0ewGk_1lebSVchuqkJbog_XbchvjxD";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("registerForm");
  const message = document.getElementById("message");
  const button = document.getElementById("registerButton");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    message.className = "mt-3 mb-0 text-danger";

    if (password !== confirmPassword) {
      message.textContent = "Zadané heslá sa nezhodujú.";
      return;
    }

    button.disabled = true;
    button.textContent = "Registrujem...";
    message.textContent = "";

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: window.location.origin + "/prihlasenie.html"
        }
      });

      if (error) throw error;

      message.className = "mt-3 mb-0 text-success";

      if (data.session) {
        message.textContent =
          "Registrácia je úspešná. Môžeš sa prihlásiť.";
      } else {
        message.textContent =
          "Registrácia bola odoslaná. Skontroluj e-mail a potvrď účet.";
      }

      form.reset();

    } catch (error) {
      message.className = "mt-3 mb-0 text-danger";
      message.textContent =
        "Registrácia sa nepodarila: " + error.message;
    } finally {
      button.disabled = false;
      button.textContent = "Registrovať sa";
    }
  });
</script>
